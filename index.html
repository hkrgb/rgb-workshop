<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RGB Workshop</title>
    <meta name="description" content="上載相片、MP4 與 MP3，即時得到像 xxxxx.jpg 咁嘅直接檔案網址。" />
    <meta property="og:title" content="RGB Workshop" />
    <meta property="og:description" content="工作室媒體庫 — 公開直連 .jpg / .mp4 / .mp3" />
    <meta property="og:url" content="https://hkrgb.github.io/rgb-workshop/" />
    <meta property="og:image" content="https://hkrgb.github.io/rgb-workshop/og.jpg" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0d0d0c; --surface: #161614; --raised: #1e1e1b; --fg: #f3f0e8;
        --muted: #9c978c; --subtle: #6e6a62; --border: #2c2c28; --accent: #ece7dc;
        --accent-fg: #0d0d0c; --danger: #c45c4a; --r: #e24a3c; --g: #3db87a; --b: #4a8fd4;
        --display: "Fraunces", "Times New Roman", serif;
        --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      body { padding-bottom: 72px; }
      button, input, a { font-family: inherit; }
      button:not(:disabled) { cursor: pointer; }
      h1, h2 { font-family: var(--display); font-weight: 500; margin: 0; text-wrap: balance; }
      .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
      header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(16px); }
      .nav { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; font-family: var(--display); font-size: 18px; }
      .mark { display: inline-flex; gap: 4px; }
      .mark i { width: 8px; height: 8px; border-radius: 2px; display: block; }
      .mark i:nth-child(1) { background: var(--r); }
      .mark i:nth-child(2) { background: var(--g); }
      .mark i:nth-child(3) { background: var(--b); }
      .ghost, .solid { border: 0; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
      .ghost { background: var(--raised); color: var(--fg); }
      .solid { background: var(--accent); color: var(--accent-fg); }
      .hero { padding: 40px 0 8px; }
      .kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--subtle); margin: 0 0 8px; }
      h1 { font-size: clamp(36px, 6vw, 52px); letter-spacing: -0.03em; }
      .lede { max-width: 36rem; color: var(--muted); font-size: 14px; line-height: 1.65; margin: 12px 0 0; }
      .drop { margin-top: 28px; border: 1px dashed var(--border); border-radius: 28px; background: var(--surface); min-height: 168px; display: grid; place-items: center; text-align: center; padding: 28px 16px; }
      .drop strong { font-family: var(--display); font-size: 24px; font-weight: 500; }
      .drop p { margin: 8px 0 16px; color: var(--muted); font-size: 14px; }
      .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 28px 0 16px; }
      .chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 13px; }
      .chip.on { background: var(--raised); color: var(--fg); border-color: transparent; }
      input[type="search"] { flex: 1; min-width: 160px; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--raised); color: var(--fg); padding: 0 14px; font-size: 14px; outline: none; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; list-style: none; padding: 0; margin: 0; }
      .card { overflow: hidden; border-radius: 24px; border: 1px solid var(--border); background: var(--surface); }
      .thumb { aspect-ratio: 16/10; background: var(--raised); display: grid; place-items: center; overflow: hidden; color: var(--subtle); }
      .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; }
      .meta { padding: 14px 16px 16px; }
      .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .url { margin-top: 6px; font-size: 12px; color: var(--muted); word-break: break-all; line-height: 1.45; }
      .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .empty { border-radius: 28px; border: 1px solid var(--border); background: var(--surface); padding: 64px 24px; text-align: center; }
      .empty h2 { font-size: 28px; }
      .empty p { color: var(--muted); margin: 8px auto 0; max-width: 28rem; font-size: 14px; }
      .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; }
      .toast.show { opacity: 1; }
      a.ghost { display: inline-flex; align-items: center; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap nav">
        <a class="brand" href="./">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
          RGB Workshop
        </a>
        <button class="ghost" id="refreshBtn" type="button">刷新</button>
      </div>
    </header>
    <main class="wrap">
      <section class="hero">
        <p class="kicker">Media vault</p>
        <h1>媒體庫</h1>
        <p class="lede">上載相片、MP4 與 MP3，即時得到像 <strong>xxxxx.jpg</strong> 咁嘅直接檔案網址。任何人打開都係檔案本身。</p>
      </section>
      <div class="drop">
        <div>
          <strong>上載檔案</strong>
          <p>會開 GitHub 上載頁。用你平時個 Google／GitHub 帳戶登入就可以拖檔入去。上載完返嚟撳刷新，就可以複製直連。</p>
          <a class="solid" href="https://github.com/hkrgb/rgb-workshop-media/upload/main" target="_blank" rel="noreferrer">選擇檔案</a>
        </div>
      </div>
      <div class="toolbar">
        <button class="chip on" data-filter="all" type="button">全部</button>
        <button class="chip" data-filter="image" type="button">相片</button>
        <button class="chip" data-filter="video" type="button">影片</button>
        <button class="chip" data-filter="audio" type="button">音訊</button>
        <input id="search" type="search" placeholder="搜尋檔名" />
      </div>
      <div id="list"></div>
    </main>
    <div class="toast" id="toast"></div>
    <script>
      const OWNER = "hkrgb";
      const REPO = "rgb-workshop-media";
      const EXT = { jpg: "image", jpeg: "image", png: "image", gif: "image", webp: "image", svg: "image", mp4: "video", mp3: "audio" };
      let items = [];
      let filter = "all";
      const toastEl = document.getElementById("toast");
      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => toastEl.classList.remove("show"), 2200);
      }
      function kindOf(name) {
        return EXT[(name.split(".").pop() || "").toLowerCase()] || null;
      }
      function fileUrl(name, sha) {
        if (sha && /^[a-f0-9]{7,40}$/i.test(sha)) {
          return `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${sha}/${name}`;
        }
        return `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${name}`;
      }
      function render() {
        const q = (document.getElementById("search").value || "").trim().toLowerCase();
        const visible = items.filter((it) => {
          if (filter !== "all" && it.kind !== filter) return false;
          if (q && !it.name.toLowerCase().includes(q)) return false;
          return true;
        });
        const root = document.getElementById("list");
        if (!visible.length) {
          root.innerHTML = `<div class="empty"><h2>尚未有檔案</h2><p>撳上面「選擇檔案」上載之後，返嚟刷新就可以複製直連，例如 xxxxx.jpg。</p></div>`;
          return;
        }
        root.innerHTML = `<ul class="grid">${visible.map((it) => {
          const media = it.kind === "image" ? `<img src="${it.url}" alt="${it.name}" />` : it.kind === "video" ? `<video src="${it.url}" muted playsinline></video>` : `<span>MP3</span>`;
          return `<li class="card"><div class="thumb">${media}</div><div class="meta"><div class="name">${it.name}</div><div class="url">${it.url}</div><div class="actions"><button class="solid" data-copy="${it.url}" type="button">複製連結</button><a class="ghost" href="${it.url}" target="_blank" rel="noreferrer">打開</a></div></div></li>`;
        }).join("")}</ul>`;
        root.querySelectorAll("[data-copy]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            await navigator.clipboard.writeText(btn.getAttribute("data-copy"));
            toast("已複製檔案連結");
          });
        });
      }
      async function loadList() {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=main`, {
          headers: { Accept: "application/vnd.github+json" },
        });
        if (!res.ok) throw new Error("無法讀取媒體庫");
        const rows = await res.json();
        items = (Array.isArray(rows) ? rows : [])
          .filter((row) => row.type === "file" && kindOf(row.name))
          .map((row) => ({ name: row.name, sha: row.sha, kind: kindOf(row.name), url: fileUrl(row.name, row.sha) }))
          .reverse();
        render();
      }
      document.getElementById("refreshBtn").addEventListener("click", () => {
        loadList().then(() => toast("已刷新")).catch((err) => toast(err.message));
      });
      document.getElementById("search").addEventListener("input", render);
      document.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          filter = btn.getAttribute("data-filter");
          document.querySelectorAll("[data-filter]").forEach((b) => b.classList.toggle("on", b === btn));
          render();
        });
      });
      loadList().catch((err) => {
        document.getElementById("list").innerHTML = `<div class="empty"><h2>暫時讀唔到媒體庫</h2><p>${err.message}</p></div>`;
      });
    </script>
  </body>
</html>
